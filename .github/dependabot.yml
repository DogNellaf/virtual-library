version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The image follows the Python version the tests run on in CI.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A new PostgreSQL major needs a dump and restore of the data volume.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
