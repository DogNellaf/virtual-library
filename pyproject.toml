[project]
name = "virtual-library"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["catalog/migrations/000[1-4]_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"docker/*.py" = ["S101", "S106", "S310"]
"scripts/*.py" = ["S101", "S106", "S603", "S607"]

[tool.coverage.run]
source = ["catalog", "virtual_library"]
omit = ["*/migrations/*", "*/tests/*", "virtual_library/asgi.py", "virtual_library/wsgi.py"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 90
