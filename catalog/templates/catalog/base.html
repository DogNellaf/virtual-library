{% load static i18n catalog %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{% translate "Media library" %}{% endblock %}</title>
  <link rel="icon" href="{% static 'catalog/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'catalog/app.css' %}">
  <script src="{% static 'catalog/app.js' %}" defer></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
